<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension Popup</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        width: 320px;
        min-height: 200px;
        background: linear-gradient(140deg, #f5f7ff 0%, #ecf8f5 100%);
        color: #20262d;
      }

      main {
        padding: 14px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 16px;
        letter-spacing: 0.3px;
      }

      #status {
        white-space: pre-wrap;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid #d9e2ea;
        border-radius: 8px;
        padding: 10px;
        min-height: 60px;
        font-size: 12px;
        line-height: 1.4;
      }

      #messageInput {
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #c4d3e0;
        padding: 8px 10px;
        font-size: 12px;
      }

      #log {
        margin-top: 10px;
        max-height: 120px;
        overflow: auto;
        border: 1px solid #d9e2ea;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
        padding: 8px;
        font-size: 11px;
        line-height: 1.4;
      }

      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        background: #1f7ae0;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1462ba;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chrome Extension Starter</h1>
      <div id="status">Loading active tab...</div>
      <button id="refresh" type="button">Refresh Info</button>
      <input id="messageInput" type="text" placeholder="Type a message for server bridge" />
      <button id="send" type="button">Send To Bridge</button>
      <div id="log">No bridge messages yet.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
